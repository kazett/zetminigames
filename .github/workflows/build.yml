name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B package

      - name: Build resource pack
        run: bash build-pack.sh

      - name: Release notes (SHA1 pack)
        run: |
          SHA=$(sha1sum ZetMinigames-Pack.zip | cut -d' ' -f1)
          echo "Resource pack SHA1: $SHA" > release-notes.txt
          echo "Resource pack SHA1: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZetMinigames
          path: |
            target/ZetMinigames.jar
            ZetMinigames-Pack.zip

      # Link tetap buat hosting pack:
      # https://github.com/<user>/<repo>/releases/download/latest-build/ZetMinigames-Pack.zip
      - name: Publish release (jar + pack)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body_path: release-notes.txt
          files: |
            target/ZetMinigames.jar
            ZetMinigames-Pack.zip
