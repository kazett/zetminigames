# ===== Resource pack (HUD custom) =====
# Isi url + sha1 dari hasil build GitHub Actions (lihat project.md).
# Kalau url kosong, HUD custom mati dan pemain cuma dapat actionbar biasa.
resource-pack:
  url: ""
  sha1: ""
  required: true
  prompt: "Resource pack ZetMinigames"

# ===== Tuning HUD =====
hud:
  # Lebar advance kepala pemain (pixel). Kalau tanda X gak pas nutup kepala, coba 8 / 9 / 10.
  head-advance: 8
  # Lebar satu slot kepala (frame 10px + jarak). Minimal 10.
  slot-width: 11

battleroyale:
  # Versi pengaturan. Kalau lebih kecil dari 3, plugin otomatis nimpa nilai lama di bawah ini.
  rev: 3
  center:
    # true = tiap game dicari titik tengah yang kebanyakan daratan (bukan laut). false = pakai x/z di bawah.
    auto: true
    x: 0
    z: 0
  sky:
    y: 300
    radius: 24
  # Waktu di platform tertutup sebelum countdown 5 detik (detik)
  ready-seconds: 30
  zone:
    start-size: 1000
    final-size: 20
    # Jumlah tahap zona diacak tiap game antara min-max (gak ditampilin di HUD)
    min-stages: 8
    max-stages: 12
    # Zona 20x20 tercapai di detik ini (dihitung dari awal countdown 5 detik). 1200 = menit 20
    total-seconds: 1200
    min-wait-seconds: 45
    min-shrink-seconds: 30
    damage: 1.0
    # Zona paksa: ukuran tercapai pada total-seconds + gap (menit 25 = 10x10) dan total-seconds + 2*gap (menit 30 = 1x1, paling kecil)
    force-gap-seconds: 300
    force-shrink-seconds: 60
    force-size-1: 10
    force-size-2: 1
  # PVP aktif sekian detik setelah platform hancur
  pvp-delay-seconds: 30
  # Detik ke berapa semua chest yang sudah ada diisi ulang (loot baru). 600 = menit 10
  chest-refill-seconds: 600

deathswap:
  # Aturan "gak boleh mati dengan cara jebakan yang sama dua kali" (cara mati sama = SERI, ronde diulang).
  # Kematian dihitung "kena jebakan lawan" kalau terjadi maks sekian detik setelah TP...
  # (otomatis dibatasi maks setengah interval TP)
  trap-window-sec: 30
  # ...dan masih dalam sekian block (horizontal) dari titik tujuan TP.
  trap-radius: 40
